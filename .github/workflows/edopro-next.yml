name: edopro-next

# Upstream's own workflow (.github/workflows/edopro.yml) is left untouched.
# This one covers only what this project adds.
#
# Cost is deliberately tiered. The regression harness and the Qt shell are
# cheap and run on every push. The full upstream client build is expensive, so
# it runs on master, on pull requests, weekly, and on demand - rather than on
# every commit to a documentation branch.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # Monday 04:00 UTC, catches upstream drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the supported floor; also test current stable.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Message table is derived, not hand-edited
        run: python tools/generate_messages.py --check

      - name: Protocol constants are derived, not hand-edited
        run: python tools/generate_protocol_constants.py --check

      - name: Structural golden trace regression tests
        # The semantic suite skips here: it needs a built client/, which the
        # semantic-client job below provides. This job covers M1 only.
        run: python -m unittest discover -s tests -v

      - name: Traces reproduce byte-for-byte from a clean tree
        # Re-render every fixture and require git to see no change. Guards
        # against a golden that only matches on the machine that produced it.
        run: |
          python tests/test_replay_trace.py --update
          git diff --exit-code -- tests/golden

  semantic-client:
    name: Semantic client model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      # No Qt, no Irrlicht, no vcpkg, no ocgcore, no card data. If this step
      # ever needs any of them, the separation M2 exists to create is broken.
      - name: Configure
        run: >
          cmake -S client -B client/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DEDOPRO_NEXT_WERROR=ON

      - name: Build
        run: cmake --build client/build --parallel

      - name: Unit tests
        run: ctest --test-dir client/build --output-on-failure

      # --require turns "the binary is missing" from a skip into a failure, so
      # this job cannot pass by quietly running nothing.
      - name: Semantic golden traces
        env:
          EDOPRO_NEXT_SEMANTIC_TRACE: ${{ github.workspace }}/client/build/edopro_next_semantic_trace
        run: python tests/test_semantic_trace.py --require -v

      - name: Semantic traces reproduce byte-for-byte
        env:
          EDOPRO_NEXT_SEMANTIC_TRACE: ${{ github.workspace }}/client/build/edopro_next_semantic_trace
        run: |
          python tests/test_semantic_trace.py --update
          git diff --exit-code -- tests/golden

  card-database:
    # Covers both edopro_next_data (the card database facade, SQLite-backed)
    # and edopro_next_deck (the deck model / .ydk codec, added alongside it -
    # data/CMakeLists.txt) since data/build carries both targets' tests. The
    # job id is left as card-database to avoid touching anything that refers
    # to it by that id; only the display name changed to stay truthful about
    # what it now runs.
    name: Card and deck data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Qt, no Irrlicht, no vcpkg, no ocgcore, no gframe, no legacy
      # DataManager - only a C++20 compiler and SQLite. If this step ever
      # needs any of the others, the separation this module exists to create
      # is broken. SQLite comes from apt, not vcpkg: this job stays in the
      # cheap, every-push tier, and does not need the upstream vcpkg bundle
      # the expensive baseline job fetches for a completely different build.
      # edopro_next_deck itself needs none of this - see data/CMakeLists.txt
      # - but the job still installs it because edopro_next_data (built in
      # the same data/build tree) does.
      - name: Ninja and SQLite3 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev

      - name: Configure
        run: >
          cmake -S data -B data/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DEDOPRO_NEXT_WERROR=ON

      - name: Build
        run: cmake --build data/build --parallel

      - name: Unit tests
        run: ctest --test-dir data/build --output-on-failure

      # policy/ (the deck legality/policy foundation - docs/architecture/
      # deck-legality.md, ADR 0007) is a standalone sibling project, same
      # shape as data/ above - same compiler, same SQLite dependency (its
      # own tests build synthetic .cdb fixtures directly via the sqlite3 C
      # API, the same pattern data/tests/synthetic_cdb.h and ui/tests use).
      # It configures its own nested copy of data/ (policy/CMakeLists.txt's
      # own comment explains why), so this is a genuinely separate
      # configure/build/test cycle, not reusing data/build above.
      - name: Configure policy
        run: >
          cmake -S policy -B policy/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DEDOPRO_NEXT_WERROR=ON

      - name: Build policy
        run: cmake --build policy/build --parallel

      - name: Deck legality/policy unit tests
        run: ctest --test-dir policy/build --output-on-failure

  qt-shell:
    name: Qt 6 shell (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev ninja-build libsqlite3-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      # ui/CMakeLists.txt nests data/ (the M3 card-database/deck/search
      # facades the deck builder screen adapts - docs/architecture/
      # deck-builder-ui.md) as a sibling CMake project, which needs SQLite3
      # dev headers here in addition to the "Card and deck data" job's own
      # standalone copy above.
      - name: Configure
        run: cmake -S ui -B ui/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEDOPRO_NEXT_UI_TESTS=ON

      - name: Build
        run: cmake --build ui/build --parallel

      # Covers the deck-builder Qt C++ adapter layer (CardCatalog,
      # SearchResultsModel, DeckSectionModel, DeckController) - every
      # fixture is synthetic data built at runtime, never a committed .cdb.
      - name: Deck builder adapter unit tests
        run: ctest --test-dir ui/build --output-on-failure

      - name: Launch offscreen and require a clean QML load
        # Two independent assertions, because either alone can pass falsely:
        #   1. The process must survive to the timeout (exit 124). A crash or
        #      early exit with empty stderr would otherwise look "clean".
        #   2. stderr must be empty. Qt reports QML errors there and still
        #      exits 0, so a silently broken binding would otherwise pass.
        run: |
          set -u
          QT_QPA_PLATFORM=offscreen timeout 20 ./ui/build/edopro_next_shell \
            > qml-stdout.log 2> qml-stderr.log && status=0 || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::shell exited early with status $status; expected it to still be running"
            cat qml-stderr.log
            exit 1
          fi
          if [ -s qml-stderr.log ]; then
            echo "::error::QML produced diagnostics on startup:"
            cat qml-stderr.log
            exit 1
          fi
          echo "shell ran for the full timeout with no QML diagnostics"

  upstream-baseline:
    name: Upstream EDOPro baseline (observer=${{ matrix.observer }})
    runs-on: ubuntu-latest
    # Expensive. Skipped on ordinary feature and documentation pushes.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        observer: [false, true]
    env:
      TRAVIS_OS_NAME: linux
      TARGET_OS: linux
      BUILD_CONFIG: release
      ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ build-essential curl p7zip-full zip git

      - name: Install premake5
        run: ./travis/install-premake5.sh linux

      - name: Bundled font and packer
        run: ./travis/install-local-dependencies.sh linux

      # Upstream publishes its dependency bundle as a dated release (e.g. tag
      # 20260819) behind a rolling "latest" URL. Resolving the tag gives a key
      # that is stable across runs but still refreshes automatically when
      # upstream republishes - which a content hash cannot do, because the URL
      # we consume is not versioned.
      #
      # Trade-off: if this lookup fails we fall back to a literal, which keeps
      # the cache usable but means that run will not pick up a new upstream
      # bundle. Bump the v1 schema segment by hand if our extraction layout
      # changes and old caches must be discarded.
      - name: Resolve upstream dependency release
        id: vcpkg-rev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/edo9300/edopro-vcpkg-cache/releases/latest --jq '.tag_name' 2>/dev/null || true)
          [ -n "$tag" ] || tag=unresolved
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream vcpkg bundle: $tag"

      - name: Cache upstream vcpkg tree
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          # Exact-match key. actions/cache only reports cache-hit == true on an
          # exact primary-key hit, so this must be stable or the download below
          # runs every time and a new cache is written on every run.
          key: vcpkg-v1-x64-linux-${{ steps.vcpkg-rev.outputs.tag }}

      - name: Fetch prebuilt dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vcpkg && cd vcpkg
          curl --retry 5 --connect-timeout 30 -L -o installed.7z https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x64-linux.7z
          7z x -y installed.7z > /dev/null
          rm installed.7z

      - name: Build client
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          EDOPRO_NEXT_SEMANTIC_OBSERVER: ${{ matrix.observer && '1' || '0' }}
        run: ./travis/build.sh

      - name: Verify artifact
        run: |
          test -f bin/x64/release/ygoprodll || { echo "::error::client binary missing"; exit 1; }
          file bin/x64/release/ygoprodll
          ls -lh bin/x64/release/ygoprodll

      - name: Real legacy / semantic fixture equivalence
        if: matrix.observer == true
        # The verifier is fail-closed on its own (processed == expected ==
        # comparisons, zero failures/mismatches - see equivalent() in
        # integration/legacy/replay_verifier.h). That alone would still pass
        # if a future regression in the legacy replay parser truncated the
        # packet stream, since expected_packets and packets_processed would
        # shrink together. So CI independently pins the known committed
        # fixture totals here, outside production verifier logic.
        run: |
          set -e
          assert_fixture_totals() {
            local fixture="$1" want="$2" log="$3"
            ./bin/x64/release/ygoprodll --semantic-verify-replay "$fixture" | tee "$log"
            for field in "expected packets" "packets processed" "comparisons performed"; do
              got=$(grep "^${field}: " "$log" | sed -E "s/^${field}: //")
              if [ "$got" != "$want" ]; then
                echo "::error::$fixture: '$field' was $got, expected the known fixture total of $want"
                exit 1
              fi
            done
          }
          assert_fixture_totals tests/fixtures/duel-chains-battle.yrpX 990 chains-battle.log
          assert_fixture_totals tests/fixtures/duel-extended.yrpX 1133 extended.log

      - name: Fault-injected verifier fails deterministically
        if: matrix.observer == true
        run: |
          set +e
          ./bin/x64/release/ygoprodll --semantic-verify-replay-fault tests/fixtures/duel-chains-battle.yrpX > fault-a.log 2>&1
          first_status=$?
          ./bin/x64/release/ygoprodll --semantic-verify-replay-fault tests/fixtures/duel-chains-battle.yrpX > fault-b.log 2>&1
          second_status=$?
          set -e
          cat fault-a.log
          test "$first_status" -ne 0
          test "$second_status" -ne 0
          grep -F "p0.life" fault-a.log
          diff -u fault-a.log fault-b.log

      - name: Real upstream .ydk interoperability proof
        if: matrix.observer == true
        # A second, unrelated proof sharing this build leg for CI-cost
        # reasons only (docs/architecture/ydk-interoperability.md) - the
        # fixed synthetic fixture and its independently-derived expected
        # output are pinned in integration/legacy/ydk_interop.cpp itself, so
        # this step only needs to check the harness's own verdict and that
        # its output is deterministic, not restate the expected card codes.
        run: |
          set -e
          ./bin/x64/release/ygoprodll --verify-ydk-interop | tee ydk-interop-a.log
          ./bin/x64/release/ygoprodll --verify-ydk-interop | tee ydk-interop-b.log
          grep -F "overall: match" ydk-interop-a.log
          diff -u ydk-interop-a.log ydk-interop-b.log

      - name: YDK interop fault-injected verifier fails deterministically
        if: matrix.observer == true
        run: |
          set +e
          ./bin/x64/release/ygoprodll --verify-ydk-interop-fault > ydk-interop-fault-a.log 2>&1
          first_status=$?
          ./bin/x64/release/ygoprodll --verify-ydk-interop-fault > ydk-interop-fault-b.log 2>&1
          second_status=$?
          set -e
          cat ydk-interop-fault-a.log
          test "$first_status" -ne 0
          test "$second_status" -ne 0
          grep -F "mismatch: separated=false main:" ydk-interop-fault-a.log
          diff -u ydk-interop-fault-a.log ydk-interop-fault-b.log
